# 追踪源配置。增删来源只需改这个文件。
# track: interp（可解释性） | ai-coding（AI 辅助编程） | engineering（通用工程）
# RSS 源可选过滤项（修改后，已存的旧条目也会在下次 fetch 时按新规则清理）：
#   require_keywords: 标题/摘要至少命中其一。<=4 字符的词按整词匹配，全大写的区分大小写
#   max_age_days:     丢弃发布时间早于 N 天的条目

arxiv:
  max_results: 40
  queries:
    - track: interp
      # arXiv API 搜索语法: https://info.arxiv.org/help/api/user-manual.html
      search: >-
        (cat:cs.LG OR cat:cs.CL OR cat:cs.AI) AND
        (abs:"mechanistic interpretability" OR abs:"sparse autoencoder" OR
         abs:"activation patching" OR abs:"circuit discovery" OR
         abs:"attribution graph" OR abs:"steering vector" OR abs:"linear probe")
    - track: ai-coding
      search: >-
        (cat:cs.SE OR cat:cs.CL) AND
        (abs:"coding agent" OR abs:"code generation" OR abs:"SWE-bench")

rss:
  - name: Alignment Forum
    url: https://www.alignmentforum.org/feed.xml
    track: interp
    # 整站都是对齐相关内容，不做关键词过滤；由 tags 规则自动打标签
  - name: Lil'Log
    url: https://lilianweng.github.io/index.xml
    track: interp
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    track: ai-coding
    # 这个 feed 包含 2020 年至今的全部文章且主题很杂：只取近 90 天、与可解释性/编程 agent 相关的
    max_age_days: 90
    require_keywords: [interpretab, mechanistic, sparse autoencoder, SAE, steering,
                       coding agent, coding model, code generation, SWE-bench, MCP]
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    track: ai-coding
    require_keywords: [claude, agent, coding, llm, prompt, codex, cursor]
  - name: Martin Fowler
    url: https://martinfowler.com/feed.atom
    track: engineering

github_releases:
  - repo: TransformerLensOrg/TransformerLens
    track: interp
  - repo: jbloomAus/SAELens
    track: interp
  - repo: ndif-team/nnsight
    track: interp
  - repo: safety-research/circuit-tracer
    track: interp
  - repo: anthropics/claude-code
    track: ai-coding
  - repo: astral-sh/uv
    track: engineering
  - repo: astral-sh/ruff
    track: engineering

# 关键词 -> 标签。在标题+摘要中命中即打标签（不区分大小写）。
tags:
  sae: [sparse autoencoder, "SAE", dictionary learning, transcoder]
  circuits: [circuit, attribution graph, path patching]
  patching: [activation patching, causal tracing, ablation]
  probing: [probe, probing, linear representation]
  steering: [steering, activation addition, representation engineering]
  superposition: [superposition, polysemantic, monosemantic]
  agents: [agent, agentic, tool use]
  evals: [benchmark, SWE-bench, evaluation]
  claude-code: [claude code, CLAUDE.md]
  pytorch: [pytorch, torch]
  python-tooling: [uv, ruff, pip, packaging]
  testing: [test, pytest, tdd]

# 用 Claude 打分和写中文摘要（需要 ANTHROPIC_API_KEY；没有就自动跳过）
llm:
  model: claude-opus-5-5     # 想更省钱可以换成 claude-haiku-5-5
  effort: low                # 打分是简单任务，low 足够
  batch_size: 20             # 每次请求处理的条目数
  max_items_per_run: 300     # 每次运行最多处理多少条
  interests: |
    - 机制可解释性（mechanistic interpretability）：SAE / transcoder、电路发现、attribution graph、
      activation patching、probing、steering、superposition。最看重能动手复现的方法和新发现。
    - 用 coding agent（如 Claude Code）写代码的实践：工作流、提示技巧、评测、真实使用经验。
    - Python / PyTorch 工程实践：可复现实验、调试、工具链（uv、ruff 等）。
    不太关心：纯产品发布新闻、融资、与上述方向无关的应用。
