<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interp & Coding Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
  --accent: #3b5bdb; --interp: #7048e8; --ai-coding: #0c8599; --engineering: #e8590c;
  --chip: #efefeb; --code: #f1f1ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131315; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31;
    --accent: #748ffc; --interp: #9775fa; --ai-coding: #3bc9db; --engineering: #ff922b;
    --chip: #2a2a2f; --code: #26262b;
  }
}
:root[data-theme="dark"] {
  --bg: #131315; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31;
  --accent: #748ffc; --interp: #9775fa; --ai-coding: #3bc9db; --engineering: #ff922b;
  --chip: #2a2a2f; --code: #26262b;
}
* { box-sizing: border-box; }
a { color: var(--accent); }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 64px; }
header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { background: none; border: 0; padding: 8px 12px; font: inherit; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
input[type=search], select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
input[type=search] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 6px 10px; border: 0; background: var(--panel);
  color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--chip); color: var(--text); font-weight: 600; }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted);
  border: 1px solid transparent; cursor: pointer; }
.tag.on { border-color: var(--accent); color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line));
  border-radius: 10px; padding: 12px 14px; }
.card.read { opacity: .55; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; }
.meta .src { font-weight: 600; color: var(--c); }
.score { font-weight: 700; font-size: 11.5px; padding: 0 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.score.hi { background: var(--accent); color: #fff; }
.orig { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.card h3 { margin: 4px 0; font-size: 15.5px; line-height: 1.4; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { color: var(--accent); }
.sum { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.row .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.row .tags .tag { cursor: default; }
.acts { display: flex; gap: 4px; flex-shrink: 0; }
.acts button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: none; color: var(--muted);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.acts button.on { color: var(--accent); border-color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.tip summary { cursor: pointer; list-style: none; }
.tip summary::-webkit-details-marker { display: none; }
.tip .body { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; overflow-wrap: anywhere; }
.tip .body pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
.tip .body code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
.tip .body pre code { background: none; padding: 0; }
.more { display: block; margin: 12px auto 0; font: inherit; font-size: 13px; padding: 6px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
.theme { float: right; font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
@media (max-width: 560px) { .stats { gap: 6px; } .stat { padding: 10px; } .stat b { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="theme" id="theme">◐ 主题</button>
    <h1>Interp & Coding Tracker</h1>
    <p id="updated">追踪 AI 可解释性与实践编程技巧</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button data-tab="feed" class="on">动态</button>
    <button data-tab="tips">技巧 & 笔记</button>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="搜索标题、摘要、作者…">
    <div class="seg" id="track">
      <button data-v="" class="on">全部</button>
      <button data-v="interp">可解释性</button>
      <button data-v="ai-coding">AI 编程</button>
      <button data-v="engineering">工程</button>
    </div>
    <select id="view">
      <option value="all">全部条目</option>
      <option value="unread">只看未读</option>
      <option value="star">只看收藏</option>
      <option value="hi">只看 ★4 以上</option>
    </select>
    <select id="sort">
      <option value="date">按时间</option>
      <option value="score">按相关度</option>
    </select>
  </div>
  <div class="tagbar" id="tagbar"></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>加载更多</button>
</div>

<script>
const TRACKS = { interp: "可解释性", "ai-coding": "AI 编程", engineering: "工程" };
const PAGE = 50;
const S = { tab: "feed", q: "", track: "", view: "all", sort: "date", tag: "", limit: PAGE, items: [], tips: [] };

// 已读/收藏只是本浏览器里的个人便利，存在 localStorage，读写失败时静默降级
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let marks = store.get("marks");   // { id: { read: bool, star: bool } }

async function loadJSON(name) {
  for (const p of [`data/${name}`, `../data/${name}`]) {
    try { const r = await fetch(p); if (r.ok) return await r.json(); } catch {}
  }
  return [];
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const color = t => `var(--${t in TRACKS ? t : "line"})`;

function renderStats() {
  const weekAgo = Date.now() - 7 * 864e5;
  const el = document.getElementById("stats");
  el.innerHTML = Object.entries(TRACKS).map(([k, label]) => {
    const all = S.items.filter(i => i.track === k);
    const recent = all.filter(i => Date.parse(i.fetched_at) >= weekAgo).length;
    return `<div class="stat"><span><i style="background:${color(k)}"></i>${label}</span>
      <b>${recent}</b><span>本周新增 · 共 ${all.length}</span></div>`;
  }).join("");
  const latest = S.items.map(i => i.fetched_at).sort().pop();
  if (latest) document.getElementById("updated").textContent =
    `最近抓取：${new Date(latest).toLocaleString("zh-CN")} · ${S.tips.length} 张技巧卡片`;
}

function filtered() {
  const src = S.tab === "feed" ? S.items : S.tips;
  const q = S.q.toLowerCase();
  return src.filter(i => {
    if (S.track && i.track !== S.track) return false;
    if (S.tag && !(i.tags || []).includes(S.tag)) return false;
    if (S.tab === "feed") {
      const m = marks[i.id] || {};
      if (S.view === "unread" && m.read) return false;
      if (S.view === "star" && !m.star) return false;
      if (S.view === "hi" && !((i.score || 0) >= 4)) return false;
    }
    if (q) {
      const hay = `${i.title} ${i.zh_title || ""} ${i.zh_summary || ""} ${i.summary || ""} ${i.body || ""} ${(i.authors || []).join(" ")} ${i.source}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTags() {
  const src = (S.tab === "feed" ? S.items : S.tips).filter(i => !S.track || i.track === S.track);
  const counts = {};
  src.forEach(i => (i.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 24);
  document.getElementById("tagbar").innerHTML = tags.map(([t, n]) =>
    `<span class="tag ${S.tag === t ? "on" : ""}" data-tag="${esc(t)}">#${esc(t)} ${n}</span>`).join("");
}

function feedCard(i) {
  const m = marks[i.id] || {};
  const date = (i.published || i.fetched_at || "").slice(0, 10);
  const score = i.score ? `<span class="score ${i.score >= 4 ? "hi" : ""}" title="Claude 评估的相关度">★${i.score}</span>` : "";
  const title = i.zh_title || i.title;
  const summary = i.zh_summary || i.summary;
  const authors = (i.authors || []).slice(0, 3).join(", ") + ((i.authors || []).length > 3 ? " 等" : "");
  return `<article class="card ${m.read ? "read" : ""}" style="--c:${color(i.track)}">
    <div class="meta">${score}<span class="src">${esc(i.source)}</span><span>${esc(date)}</span>${authors ? `<span>${esc(authors)}</span>` : ""}</div>
    <h3><a href="${esc(i.url)}" target="_blank" rel="noopener" data-open="${esc(i.id)}">${esc(title)}</a></h3>
    ${i.zh_title ? `<p class="orig">${esc(i.title)}</p>` : ""}
    ${summary ? `<p class="sum">${esc(summary)}</p>` : ""}
    <div class="row"><div class="tags">${(i.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
      <div class="acts">
        <button data-mark="star" data-id="${esc(i.id)}" class="${m.star ? "on" : ""}">${m.star ? "★ 已收藏" : "☆ 收藏"}</button>
        <button data-mark="read" data-id="${esc(i.id)}" class="${m.read ? "on" : ""}">${m.read ? "✓ 已读" : "标为已读"}</button>
      </div></div>
  </article>`;
}

function tipCard(t) {
  const md = window.marked ? marked.parse(t.body) : `<pre>${esc(t.body)}</pre>`;
  return `<details class="card tip" style="--c:${color(t.track)}">
    <summary>
      <div class="meta"><span class="src">${t.kind === "paper-note" ? "论文笔记" : TRACKS[t.track] || t.track}</span>
        <span>${esc(t.date)}</span><span>${esc(t.path)}</span></div>
      <h3>${esc(t.title)}</h3>
      <div class="row"><div class="tags">${(t.tags || []).map(x => `<span class="tag">#${esc(x)}</span>`).join("")}</div></div>
    </summary>
    <div class="body">${md}${t.source ? `<p><a href="${esc(t.source)}" target="_blank" rel="noopener">来源 ↗</a></p>` : ""}</div>
  </details>`;
}

function render() {
  renderTags();
  const rows = filtered();
  if (S.tab === "feed") rows.sort(S.sort === "score"
    ? (a, b) => (b.score || 0) - (a.score || 0) || (b.published || "").localeCompare(a.published || "")
    : (a, b) => (b.published || b.fetched_at || "").localeCompare(a.published || a.fetched_at || ""));
  const shown = rows.slice(0, S.limit);
  const list = document.getElementById("list");
  list.innerHTML = shown.length ? shown.map(S.tab === "feed" ? feedCard : tipCard).join("")
    : `<div class="empty">${(S.tab === "feed" ? S.items : S.tips).length ? "没有匹配的条目" :
        S.tab === "feed" ? "还没有数据：运行 <code>python -m tracker all</code> 或等待 GitHub Actions 定时抓取" : "还没有卡片"}</div>`;
  const more = document.getElementById("more");
  more.hidden = rows.length <= S.limit;
  more.textContent = `加载更多（还有 ${rows.length - S.limit} 条）`;
  for (const id of ["view", "sort"]) document.getElementById(id).style.display = S.tab === "feed" ? "" : "none";
}

function toggle(id, key, value) {
  const m = marks[id] || {};
  m[key] = value ?? !m[key];
  marks[id] = m;
  store.set("marks", marks);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-v],[data-tag],[data-mark],[data-open]");
  if (!t) return;
  if (t.dataset.tab) {
    S.tab = t.dataset.tab; S.tag = ""; S.limit = PAGE;
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === t));
  } else if (t.dataset.v !== undefined) {
    S.track = t.dataset.v; S.tag = ""; S.limit = PAGE;
    document.querySelectorAll("#track button").forEach(b => b.classList.toggle("on", b === t));
  } else if (t.dataset.tag) {
    S.tag = S.tag === t.dataset.tag ? "" : t.dataset.tag;
  } else if (t.dataset.mark) {
    toggle(t.dataset.id, t.dataset.mark);
  } else if (t.dataset.open) {
    toggle(t.dataset.open, "read", true);   // 点开链接即视为已读
  }
  render();
});
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; S.limit = PAGE; render(); });
document.getElementById("view").addEventListener("change", e => { S.view = e.target.value; S.limit = PAGE; render(); });
document.getElementById("sort").addEventListener("change", e => { S.sort = e.target.value; S.limit = PAGE; render(); });
document.getElementById("more").addEventListener("click", () => { S.limit += PAGE; render(); });
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
});
try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch {}

(async () => {
  [S.items, S.tips] = await Promise.all([loadJSON("items.json"), loadJSON("tips.json")]);
  renderStats();
  render();
})();
</script>
</body>
</html>
